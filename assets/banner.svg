<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- YC Orange Gradient -->
    <linearGradient id="ycOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff742b" />
      <stop offset="100%" stop-color="#ff5100" />
    </linearGradient>

    <!-- Accent Gradient for Text & Highlights -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#ff8647" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <style>
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .beam-1 {
        animation: beamMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .beam-2 {
        animation: beamMove 5s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.5s;
      }
      .float-badge {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-badge-delayed {
        animation: float 4.5s ease-in-out infinite alternate 2s;
      }

      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.5; }
        100% { transform: scale(1.04); opacity: 0.85; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 600; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Radial Atmosphere Lighting -->
  <circle class="pulse-circle" cx="200" cy="180" r="220" fill="#ff6600" opacity="0.12" filter="url(#softGlow)" />
  <circle class="pulse-circle" cx="950" cy="180" r="240" fill="#2563eb" opacity="0.08" filter="url(#softGlow)" />

  <!-- Animated Data Connection Streams -->
  <g fill="none" opacity="0.6">
    <path d="M 450,230 C 650,230 700,120 900,120" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 450,230 C 650,230 700,240 900,240" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" />

    <path class="beam-1" d="M 450,230 C 650,230 700,120 900,120" stroke="url(#ycOrange)" stroke-width="3" stroke-dasharray="80 500" />
    <path class="beam-2" d="M 450,230 C 650,230 700,240 900,240" stroke="#0077b5" stroke-width="3" stroke-dasharray="80 500" />
  </g>

  <!-- Left: YC Brand Emblem -->
  <g transform="translate(100, 100)">
    <!-- Outer Glow & Card -->
    <rect x="-8" y="-8" width="176" height="176" rx="36" fill="#ff5100" opacity="0.2" filter="url(#glow)" />
    <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#ycOrange)" />
    
    <!-- Y Logo Inner Monogram -->
    <path d="M 45 42 L 72 42 L 80 65 L 88 42 L 115 42 L 91 85 L 91 122 L 69 122 L 69 85 Z" fill="#ffffff" />

    <!-- Radar Sweep Ring -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />
  </g>

  <!-- Middle: Main Typography & Badges -->
  <g transform="translate(300, 115)">
    <!-- Project Title -->
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.02em">
      YCScraper
    </text>
    
    <!-- Version / Status Badge -->
    <g transform="translate(245, 10)">
      <rect x="0" y="0" width="95" height="26" rx="13" fill="#ff742b" fill-opacity="0.15" stroke="#ff742b" stroke-width="1" />
      <circle cx="12" cy="13" r="4" fill="#ff742b">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ff9e6c" letter-spacing="0.05em">SCRAPER</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#9ca3af">
      Automated intelligence for <tspan fill="#f9fafb" font-weight="600">Y-Combinator</tspan> founders &amp; social profiles
    </text>

    <!-- Capability Tags -->
    <g transform="translate(0, 110)">
      <!-- Tag 1: Batches API -->
      <g>
        <rect x="0" y="0" width="125" height="30" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">⚡ Batch API</text>
      </g>
      <!-- Tag 2: Selenium Bot -->
      <g transform="translate(135, 0)">
        <rect x="0" y="0" width="135" height="30" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">🤖 Selenium Auto</text>
      </g>
      <!-- Tag 3: CSV Export -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="125" height="30" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">📊 CSV Export</text>
      </g>
    </g>
  </g>

  <!-- Right: Floating Target Profiles -->
  <!-- LinkedIn Floating Card -->
  <g class="float-badge" transform="translate(860, 85)">
    <rect width="240" height="74" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    <!-- LinkedIn Icon -->
    <rect x="18" y="17" width="40" height="40" rx="8" fill="#0077b5" />
    <text x="38" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
    
    <text x="72" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">LinkedIn Profile</text>
    <text x="72" y="52" font-family="monospace" font-size="11" fill="#38bdf8">linkedin.com/in/*</text>
    
    <!-- Extraction Status Dot -->
    <circle cx="215" cy="37" r="4" fill="#22c55e">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- X.com Floating Card -->
  <g class="float-badge-delayed" transform="translate(860, 195)">
    <rect width="240" height="74" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    <!-- X Logo Icon -->
    <rect x="18" y="17" width="40" height="40" rx="8" fill="#000000" stroke="#334155" stroke-width="1" />
    <path d="M 33 29 L 41 40 L 32 49 L 34.5 49 L 42 41.5 L 47 49 L 53 49 L 45 37.5 L 53 29 L 50.5 29 L 43.5 36.2 L 39 29 Z" fill="#ffffff" />
    
    <text x="72" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">X (Twitter) Profile</text>
    <text x="72" y="52" font-family="monospace" font-size="11" fill="#a855f7">x.com/*</text>
    
    <!-- Extraction Status Dot -->
    <circle cx="215" cy="37" r="4" fill="#22c55e">
      <animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#ycOrange)" />
</svg>
